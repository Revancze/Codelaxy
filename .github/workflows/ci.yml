name: CI

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet csharpier check .

      - name: Warning gate self-tests
        run: python -B tools/ci/test_warning_gate.py

      - name: F3 warning gate (Debug)
        run: python tools/ci/warning_gate.py collect-and-check --repo-root . --baseline tools/ci/warning-baseline.json

      - name: Test
        run: dotnet test --configuration Debug --no-build --no-restore

      - name: Golden Git configuration isolation
        run: python -B tests/verify_golden_git_config.py

      - name: RoadmapRegistry portable gate
        env:
          CLX_WORKSPACE_ROOT: ${{ runner.temp }}/codelaxy-no-workspace
          CLX_TESTRUN_ROOT: ${{ runner.temp }}/codelaxy-no-testrun
        run: >-
          python -B -X utf8 -W error tools/ci/registry_gate.py
          --expected-tests 859
          --expected-skips 30
          --skip-policy tools/ci/registry-portable-skips.json
